[package]
name = "pdb-compare"
version = "0.1.0"
edition = "2021"

[dependencies]
# New ezpdb using ms-pdb (local)
ezpdb = { path = "../ezpdb" }
# Old ezpdb using pdb crate 0.8 (from GitHub)
ezpdb-old = { package = "ezpdb", git = "https://github.com/landaire/pdbview", branch = "master" }
# Direct ms-pdb access for deep investigation
ms-pdb = { path = "../ms-pdb/pdb" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.4", features = ["derive"] }
